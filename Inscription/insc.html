<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouCode Events - Inscription</title>
    <link rel="stylesheet" href="insc.css">
    
<body>
<main>
    <section class="hero">
            <h1>Inscription</h1>
            <p>Réservez votre place à un atelier, une conférence, un hackathon ou une rencontre. L'inscription est gratuite.</p>
    </section>
    <div class="All">
    <div class="Mapage">
            <h2>Vos informations</h2>
            <p>Les champs marqués * sont obligatoires.</p>
    </div>

     <form>
        <div class="info">
            <div classe="identifiants">
              <label>Nom *</label>
              <input type="text" placeholder="Votre nom" required>
            </div>

            <div class="identifiants">
               <label>Prénom *</label>
               <input type="text" value="Salma" class="Input-suc" required>
               <small class="txtt-affirm">Champ valide.</small>
            </div>
        </div>

        <div class="info">
           <div class="identifiants">
               <label>Adresse e-mail *</label>
               <input type="email" value="salma@exemple" class="Input-err" required>
               <small class="txtt-err">Erreur : saisissez une adresse valide, par exemple nom@domaine.ma.</small>
           </div>
          
            <div class="identifiants">
              <label>Téléphone</label>
              <input type="tel" placeholder="06 12 34 56 78">
            </div>
        </div>


        
     
    
    
    
    
    </div>
     </form>
</main>






    
</body>
</html>
